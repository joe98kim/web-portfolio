<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
  // GitHub Pages is static hosting with no server-side rewrites, so a
  // direct load or refresh on a route like /about or /work/dess lands
  // here (404) instead of index.html. Redirect to the site root with the
  // real path packed into a query param; index.html's bootstrap script
  // unpacks it and restores the real URL via history.replaceState before
  // the app ever renders, so the visitor never sees this page.
  var target = location.pathname + location.search + location.hash;
  location.replace(location.origin + '/?p=' + encodeURIComponent(target));
</script>
</head>
<body></body>
</html>
